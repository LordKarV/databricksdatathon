<!DOCTYPE html>
<html lang="en">
<head>
	<title>Ola Cabs Deep Link</title>
	<meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'>
	<style>
		.loader-container {
			stroke: white;
			position: absolute;
			top: 100px;
			left: 50%;
			margin-left: -90px;
		}

		.loader-container svg {
			transform: rotate(-90deg);
		}

		.loader-container circle {
			stroke-dasharray: 390;
			stroke-dashoffset: 390;
			animation: dash 2s infinite;
		}

		.ld-text-2 {
			position: absolute;
			top: 177px;
			font-size: 24px;
			top: 72px;
			width: 100%;
			text-align: center;
		}

		.ld-text-1 {
			position: absolute;
			top: 80px;
			left: 50%;
			margin-left: -33px;
			font-size: 20px;
		}

		@keyframes dash {
		0 { stroke-dashoffset: 390; }
		50% { stroke-dashoffset: 0; }
		100% { stroke-dashoffset: -390; }
		}
	</style>
</head>

<body>
<div class="ld-text-1">
	Loading
</div>

<div class="loader-container">

	<div id="timer" class="ld-text-2">
		5
	</div>

	<svg style="height: 180px; width: 180px; stroke: #cfd43d;">
		<circle cx="90" cy="90" r="60" stroke-width="5" fill="none"/>
	</svg>
</div>

<script type="text/javascript">
	var userAgent = window.navigator.userAgent;

	function getJsonFromUrl() {
		var query = window.location.search.substr(1);
		var result = {};
		query.split("&").forEach(function (part) {
			var item = part.split("=");
			result[item[0]] = decodeURIComponent(item[1]);
		});
		return result;
	}

	var params = window.location.search;
	var parsedParams = getJsonFromUrl();

	function openWebsite() {
		if (parsedParams["landing_page"] === "payment_pending" && parsedParams["instrument_type"] === "credit_card" && parsedParams["currency_code"] !== "INR") {
			if (userAgent.match(/iPad/i) || userAgent.match(/iPhone/i)) {
				clearInterval(this.decrementInterval);
				window.location = "https://itunes.apple.com/in/app/ola-cabs/id539179365";
				return;
			} else if (userAgent.match(/android/i)) {
				clearInterval(this.decrementInterval);
				window.location = "https://play.google.com/store/apps/details?id=com.olacabs.customer";
				return;
			}
		}

		var toUrl = "";
		if (parsedParams["category"] == "outstation")
			toUrl = "https://book.olacabs.com/outstation-cabs" + params;
		else if (parsedParams["category"] == "local")
			toUrl = "https://book.olacabs.com/rental-cabs" + params;
		else
			toUrl = "https://book.olacabs.com" + params;

		if (parsedParams["bk_act"] == "rl") {
			toUrl += "&when=later";
		}
		clearInterval(this.decrementInterval);
		window.location = toUrl;

	}

	var timerVal = 6;

	function decrementValue() {
		if (this.timerVal > 1) {
			this.timerVal--;
			document.getElementById("timer").innerText = "" + (this.timerVal - 1);
		} else {
			this.openWebsite();
		}

	}

	if (parsedParams["channel"] !== "web") {
		window.location = "olacabs://app/launch" + params;
	}

	var decrementInterval = setInterval(decrementValue, 1000);
</script>
</body>

</html>
